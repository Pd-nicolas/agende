version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: agende-db
    environment:
      POSTGRES_DB: agende
      POSTGRES_USER: agende
      POSTGRES_PASSWORD: agende123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agende -d agende"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: agende-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/agende
      - SPRING_DATASOURCE_USERNAME=agende
      - SPRING_DATASOURCE_PASSWORD=agende123
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
