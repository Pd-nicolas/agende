# H2 Database
spring.datasource.url=jdbc:postgresql://localhost:5432/planmob
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none

## Swagger
springdoc.swagger-ui.enabled=true

## Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=false

# === NOME DO SISTEMA
spring.application.name=multitenant
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

# === MULTITENANCY CONFIG
spring.jpa.properties.hibernate.multiTenancy=SCHEMA
spring.jpa.properties.hibernate.multi_tenant_connection_provider=com.agende.agendeapi.hibernate.MultiTenantConnectionProviderImpl
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.agende.agendeapi.hibernate.CurrentTenantIdentifierResolverImpl

spring.flyway.locations=classpath:db/migration

# === JACKSON (CONFIGURAÇÕES DE SERIALIZAÇÃO)
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=NON_NULL

logging.level.org.hibernate.engine.jdbc.connections.internal.MultiTenantConnectionProviderInitiator=DEBUG
logging.level.br.com.planmobapi.hibernate=DEBUG

spring.jpa.properties.hibernate.default_schema=

# Logging para debug
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=DEBUG
logging.level.org.flywaydb.core=DEBUG
