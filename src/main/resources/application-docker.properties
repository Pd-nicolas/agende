# DataSource PostgreSQL
spring.datasource.url=jdbc:postgresql://db:5432/agende
spring.datasource.username=agende
spring.datasource.password=agende123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none

## Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=false

spring.application.name=multitenant
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# === MULTITENANCY CONFIG
spring.jpa.properties.hibernate.multiTenancy=SCHEMA
spring.jpa.properties.hibernate.multi_tenant_connection_provider=com.agende.agendeapi.hibernate.MultiTenantConnectionProviderImpl
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.agende.agendeapi.hibernate.CurrentTenantIdentifierResolverImpl

spring.flyway.locations=classpath:db/migration

# === JACKSON (CONFIGURAÇÕES DE SERIALIZAÇÃO)
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=NON_NULL

spring.jpa.properties.hibernate.default_schema=

